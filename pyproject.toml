[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supply-twin"
version = "0.1.0"
description = "AI Supply Chain Digital Twin with a what-if disruption simulator"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ghanendrasahu", email = "ghanendrasahu2911@gmail.com" }]
keywords = ["supply-chain", "digital-twin", "simulation", "forecasting", "ml"]
dependencies = [
    "numpy>=1.26,<2.3",
    "pandas>=2.1,<2.3",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "networkx>=3.2",
    "simpy>=4.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "matplotlib>=3.8",
    "typer>=0.12",
    "rich>=13.7",
    "streamlit>=1.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
]

[project.scripts]
supply-twin = "supply_twin.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --cov=supply_twin --cov-report=term-missing --cov-report=xml"
filterwarnings = [
    "ignore:.*starlette.*:UserWarning",
    "ignore:.*starlette.*:DeprecationWarning",
    "ignore:.*httpx.*:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.coverage.run]
source = ["supply_twin"]
omit = ["*/cli.py", "*/api/main.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise NotImplementedError"]
fail_under = 85
