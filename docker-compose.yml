services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - SUPPLY_TWIN_RANDOM_SEED=42
      - SUPPLY_TWIN_MONTE_CARLO_RUNS=1000
      - SUPPLY_TWIN_DATA_DIR=/app/data
      - SUPPLY_TWIN_REPORT_DIR=/app/data/reports
      - SUPPLY_TWIN_API_KEYS=${SUPPLY_TWIN_API_KEYS:-}
      - SUPPLY_TWIN_RATE_LIMIT_WINDOW=${SUPPLY_TWIN_RATE_LIMIT_WINDOW:-60}
      - SUPPLY_TWIN_RATE_LIMIT_MAX_REQUESTS=${SUPPLY_TWIN_RATE_LIMIT_MAX_REQUESTS:-120}
      - SUPPLY_TWIN_WHAT_IF_MAX_CONCURRENT=${SUPPLY_TWIN_WHAT_IF_MAX_CONCURRENT:-2}
      - SUPPLY_TWIN_LOG_JSON=${SUPPLY_TWIN_LOG_JSON:-false}
      - SUPPLY_TWIN_LOG_LEVEL=${SUPPLY_TWIN_LOG_LEVEL:-INFO}
    volumes:
      - twin-data:/app/data

volumes:
  twin-data:
